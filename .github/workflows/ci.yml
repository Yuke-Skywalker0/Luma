name: Luma CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix backend
      - run: npm install --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run build --prefix backend
